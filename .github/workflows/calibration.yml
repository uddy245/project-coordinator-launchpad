name: Calibration corpus

# Runs the grading pipeline against the fixture corpus with the real
# Anthropic API. Runs only when started manually (workflow_dispatch).
# A full run makes roughly one Sonnet grading call per fixture (~140
# calls), so cost scales with the number of fixtures.
#
# Triggers:
#   - workflow_dispatch: manual runs (any branch)
on:
  workflow_dispatch:

jobs:
  calibration:
    name: Run calibration corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run calibration
        run: pnpm vitest run tests/integration/calibration.test.ts --reporter verbose
        env:
          RUN_CALIBRATION: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-5
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          NEON_AUTH_BASE_URL: https://placeholder.neonauth.example.com/neondb/auth
          NEON_AUTH_COOKIE_SECRET: placeholder-neon-auth-cookie-secret-32-chars
          AWS_ENDPOINT_URL_S3: https://br-placeholder.storage.c-1.us-east-1.aws.neon.tech
          AWS_ACCESS_KEY_ID: placeholder
          AWS_SECRET_ACCESS_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PRICE_ID: price_placeholder
          GRADE_WORKER_SECRET: placeholder-grade-worker-secret-32-chars
